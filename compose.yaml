services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  server:
    build: .
    command: ["wordcount-server"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WORDCOUNT_FILES_DIR: /app/src/wordcount_service/files
    ports:
      - "18812:18812"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('localhost', 18812), 2).close()"
      interval: 3s
      timeout: 3s
      retries: 10

  client:
    build: .
    command:
      [
        "wordcount-client",
        "--file",
        "twilight-annette-lyster.txt",
        "--keyword",
        "Christie",
      ]
    environment:
      SERVER_HOST: server
      SERVER_PORT: "18812"
    depends_on:
      server:
        condition: service_healthy
