[project]
name = "wordcount-service"
version = "0.1.0"
description = "Distributed word count service for the ADS lab assignment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=8.1.0",
    "rpyc>=6.0.2",
]

[project.scripts]
wordcount-client = "wordcount_service.client:main"
wordcount-loadbalancer = "wordcount_service.load_balancer:main"
wordcount-server = "wordcount_service.server:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=9.1.1",
]
